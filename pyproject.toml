[project]
name = "teleagent"
version = "0.1.0"
description = "Telegram bot for remote control"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot==22.0",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "anyio==4.9.0",
    "certifi==2025.1.31",
    "h11==0.14.0",
    "httpcore==1.0.7",
    "idna==3.10",
    "sniffio==1.3.1",
    "typing_extensions==4.12.2"
]

[project.scripts]
teleagent = "teleagent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"